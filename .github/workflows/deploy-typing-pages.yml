name: Publish MOCHI TYPE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mochi-type-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run test:typing
      - run: npm run check
      - name: Build the game for its public path
        run: |
          npm run build -- --base="/${{ github.event.repository.name }}/"
          cp dist/typing.html dist/index.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
